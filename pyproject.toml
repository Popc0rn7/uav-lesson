[project]
name = "uav-lesson"
version = "0.1.0"
description = "无人机实践课程：RoboPi、PX4/Gazebo 仿真与自主飞行实验"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "msgpack>=1.1,<2",
    "pyyaml>=6,<7",
    "requests>=2.34.2",
]

[project.optional-dependencies]
stage4 = ["numpy>=1.26,<3", "pillow>=12.3.0", "pyulog>=1.2,<2"]
flight-review = [
    "pymavlink>=2.4.50,<3",
    "pyulog>=1.2,<2",
    "numpy>=1.26,<3",
    "matplotlib>=3.10,<4",
]
stage5 = ["typesafe-sdk>=0.7,<1", "socksio>=1,<2", "pymavlink>=2.4.49,<3", "numpy>=2.5.3", "pillow>=12.3.0"]
stage2 = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pymavlink>=2.4.50,<3",
]
